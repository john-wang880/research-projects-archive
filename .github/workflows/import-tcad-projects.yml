name: Import recent TCAD simulations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-tcad-projects:
    if: ${{ !contains(github.event.head_commit.message, '[tcad-import]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Copy the two recent TCAD projects and two standalone repositories
        shell: bash
        run: |
          set -euo pipefail

          # The two recent projects from the TCAD monorepo
          git clone --depth 1 https://github.com/Greatlovers/TCAD.git /tmp/source-tcad
          mkdir -p training
          cp -a /tmp/source-tcad/training/CS-SJ-IGBT training/
          cp -a /tmp/source-tcad/training/RC-IGBT training/

          # Two additional standalone TCAD repositories from the same owner
          git clone --depth 1 https://github.com/Greatlovers/dynamic-CBL-IGBT-3D.git /tmp/source-dynamic-cbl
          mkdir -p projects/dynamic-CBL-IGBT-3D
          tar --exclude=.git -cf - -C /tmp/source-dynamic-cbl . | tar -xf - -C projects/dynamic-CBL-IGBT-3D

          git clone --depth 1 https://github.com/Greatlovers/reproduction-of-high-speed-4h-sic-micro-hole-uv-photodiode-arrays.git /tmp/source-sic-uv
          mkdir -p projects/reproduction-of-high-speed-4h-sic-micro-hole-uv-photodiode-arrays
          tar --exclude=.git -cf - -C /tmp/source-sic-uv . | tar -xf - -C projects/reproduction-of-high-speed-4h-sic-micro-hole-uv-photodiode-arrays

          cat > README.md <<'EOF'
          # TCAD Simulation Archive

          This archive contains four Sentaurus/TCAD projects copied from the public repositories owned by [Greatlovers](https://github.com/Greatlovers). The source repositories remain unchanged.

          ## Projects from the TCAD collection

          - **CS-SJ-IGBT** — 650 V trench field-stop charge-storage super-junction IGBT reproduction. See [project README](training/CS-SJ-IGBT/README.md), [Workbench export](training/CS-SJ-IGBT/CS-SJ-IGBT.gzp), and [results dashboard](training/CS-SJ-IGBT/figures/fig_07_results_dashboard.png).
          - **RC-IGBT** — reverse-conducting IGBT Sentaurus project. See [project README](training/RC-IGBT/README.md), [sanitized Workbench package](training/RC-IGBT/RC-IGBT_swb_project_sanitized.zip), and [PDF guide](training/RC-IGBT/rc_igbt_project_documentation.pdf).

          ## Additional standalone projects

          - **dynamic-CBL-IGBT-3D** — [source repository](https://github.com/Greatlovers/dynamic-CBL-IGBT-3D); includes a no-material-parameters archive. See [local project folder](projects/dynamic-CBL-IGBT-3D/).
          - **4H-SiC micro-hole UV photodiode arrays** — [source repository](https://github.com/Greatlovers/reproduction-of-high-speed-4h-sic-micro-hole-uv-photodiode-arrays); includes Sentaurus source templates and setup utilities. See [local project folder](projects/reproduction-of-high-speed-4h-sic-micro-hole-uv-photodiode-arrays/).

          ## Requirements and notices

          Rerunning these projects requires a valid local Sentaurus/Synopsys installation and license. Some source projects intentionally exclude material parameter files, optical material tables, and generated states; see each project's README before running. Preserve the original license and notice files in each copied project. Third-party paper excerpts and other third-party content remain subject to their owners' rights; this archive grants no additional rights.

          ## Sources

          - https://github.com/Greatlovers/TCAD
          - https://github.com/Greatlovers/dynamic-CBL-IGBT-3D
          - https://github.com/Greatlovers/reproduction-of-high-speed-4h-sic-micro-hole-uv-photodiode-arrays
          EOF

      - name: Commit imported projects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md training/CS-SJ-IGBT training/RC-IGBT projects/dynamic-CBL-IGBT-3D projects/reproduction-of-high-speed-4h-sic-micro-hole-uv-photodiode-arrays
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git commit -m "Import two additional TCAD repositories [tcad-import]"
          git push origin HEAD:main
